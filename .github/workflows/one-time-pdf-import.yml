name: One-time import of reviewed workshop PDFs

on:
  push:
    branches: [pdf-only-release-20261115]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download exact reviewed PDFs and verify checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p slides
          curl --fail --location --silent --show-error --retry 2 --max-time 100 \
            --output slides/Monday_Project_Introduction.pdf \
            "https://at.adobe.com/uOhFa50nj0NaoJ30"
          curl --fail --location --silent --show-error --retry 2 --max-time 100 \
            --output slides/Tuesday_lecture_integrated.pdf \
            "https://at.adobe.com/fa4U17dYSaBhCPbe"
          printf '%s\n' \
            "5a215e05a1acc06119428c77738fd8e36e125f692af8f84ab33250a52fdfa36f  slides/Monday_Project_Introduction.pdf" \
            "50ffd16d3d41410b93deecbb78d6b7e3708011157e8df02dab793476b86770a5  slides/Tuesday_lecture_integrated.pdf" | sha256sum -c -
          test "$(head -c 4 slides/Monday_Project_Introduction.pdf)" = "%PDF"
          test "$(head -c 4 slides/Tuesday_lecture_integrated.pdf)" = "%PDF"
          ls -lh slides/Monday_Project_Introduction.pdf slides/Tuesday_lecture_integrated.pdf
      - name: Commit the reviewed assets to the release branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add slides/Monday_Project_Introduction.pdf slides/Tuesday_lecture_integrated.pdf
          git rm .github/workflows/one-time-pdf-import.yml
          git commit -m "Import checksum-verified Monday and Tuesday workshop PDFs"
          git push origin HEAD:pdf-only-release-20261115
