name: Workshop materials build and validation

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workshop:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install core workshop dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nbclient ipykernel python-pptx

      - name: Generate challenge data and every notebook from its source
        run: |
          python project/generate_open_challenge.py
          python -m project.mimic_like_adapter --demo
          python notebooks/source/lecture1.py
          python notebooks/source/lecture2.py
          python notebooks/source/hierarchical.py
          python notebooks/source/sbi_neural.py
          python notebooks/source/project_starter.py
          python notebooks/source/open_research_challenge.py
          python notebooks/source/three_day_research.py

      - name: Run and save independent-test simulation study
        run: python -m project.research_experiments --repeats 3 --source-size 2000 --test-size 1200

      - name: Validate datasets and notebooks
        run: python tools/validate_workshop.py

      - name: Execute core notebooks
        run: |
          python tools/run_notebook.py notebooks/01_lecture1_uncertainty_foundations_instructor.ipynb
          python tools/run_notebook.py notebooks/02_lecture2_trustworthy_deployment_instructor.ipynb
          python tools/run_notebook.py notebooks/01_lecture1_uncertainty_foundations_student.ipynb
          python tools/run_notebook.py notebooks/02_lecture2_trustworthy_deployment_student.ipynb
          python tools/run_notebook.py notebooks/90_team_project_starter.ipynb
          python tools/run_notebook.py notebooks/91_open_research_challenge_starter.ipynb
          python tools/run_notebook.py notebooks/92_three_day_research_starter.ipynb

      - name: Rehearse student launch from an empty workspace
        env:
          PYTHONPATH: ""
          WORKSHOP_REPO_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          STUDENT_DIR="$(mktemp -d)"
          cp notebooks/92_three_day_research_starter.ipynb "$STUDENT_DIR/student.ipynb"
          cd "$STUDENT_DIR"
          python "$GITHUB_WORKSPACE/tools/run_notebook.py" "$STUDENT_DIR/student.ipynb"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regenerate slide figures and PowerPoint decks
        run: |
          python slides/make_figures.py
          npm install --prefix slides/src --no-save pptxgenjs
          cd slides
          node src/deck1.js
          node src/deck2.js
          node src/one_lecture.js

      - name: Validate slide geometry, notes and scientific provenance
        run: |
          python tools/check_slides.py
          python tools/audit_integrated_lecture.py
          git diff --check

      - name: Install local presentation renderer when missing
        run: |
          if ! command -v libreoffice >/dev/null 2>&1 || ! command -v pdftoppm >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libreoffice-impress poppler-utils
          fi

      - name: Render all 23 lecture pages for visual inspection
        run: python tools/render_integrated_lecture_review.py
