name: Workshop materials build and validation

on:
  push:
    branches:
      - workshop-prep-2026-oct
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  workshop:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install core workshop dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nbclient ipykernel python-pptx

      - name: Generate challenge data and every notebook from its source
        run: |
          python project/generate_open_challenge.py
          python notebooks/source/lecture1.py
          python notebooks/source/lecture2.py
          python notebooks/source/hierarchical.py
          python notebooks/source/sbi_neural.py
          python notebooks/source/project_starter.py
          python notebooks/source/open_research_challenge.py

      - name: Validate datasets and notebooks
        run: python tools/validate_workshop.py

      - name: Execute core notebooks
        run: |
          python tools/run_notebook.py notebooks/01_lecture1_uncertainty_foundations_instructor.ipynb
          python tools/run_notebook.py notebooks/02_lecture2_trustworthy_deployment_instructor.ipynb
          python tools/run_notebook.py notebooks/01_lecture1_uncertainty_foundations_student.ipynb
          python tools/run_notebook.py notebooks/02_lecture2_trustworthy_deployment_student.ipynb
          python tools/run_notebook.py notebooks/90_team_project_starter.ipynb
          python tools/run_notebook.py notebooks/91_open_research_challenge_starter.ipynb

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regenerate slide figures and PowerPoint decks
        run: |
          python slides/make_figures.py
          npm install --prefix slides/src --no-save pptxgenjs
          cd slides
          node src/deck1.js
          node src/deck2.js

      - name: Validate slide geometry and whitespace
        run: |
          python tools/check_slides.py
          git diff --check

      - name: Commit verified generated workshop materials
        if: github.event_name == 'push' && github.ref_name == 'workshop-prep-2026-oct'
        run: |
          git add notebooks/01_lecture1_uncertainty_foundations_student.ipynb
          git add notebooks/01_lecture1_uncertainty_foundations_instructor.ipynb
          git add notebooks/02_lecture2_trustworthy_deployment_student.ipynb
          git add notebooks/02_lecture2_trustworthy_deployment_instructor.ipynb
          git add notebooks/03_hierarchical_pymc_student.ipynb
          git add notebooks/03_hierarchical_pymc_instructor.ipynb
          git add notebooks/04_simulation_based_inference_student.ipynb
          git add notebooks/04_simulation_based_inference_instructor.ipynb
          git add notebooks/90_team_project_starter.ipynb
          git add notebooks/91_open_research_challenge_starter.ipynb
          git add project/open_data
          git add slides/figures slides/lecture1_honest_probabilities.pptx slides/lecture2_deciding_under_uncertainty.pptx
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Regenerate and verify workshop decks, notebooks and project data'
            git push origin HEAD:workshop-prep-2026-oct
          fi
