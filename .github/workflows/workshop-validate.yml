name: Workshop materials build and validation

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches:
      - workshop-prep-2026-oct
      - main
      - chatgpt/mauritius-one-lecture-three-day-research-2026
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  workshop:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install core workshop dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nbclient ipykernel python-pptx

      - name: Generate challenge data and every notebook from its source
        run: |
          python project/generate_open_challenge.py
          python -m project.mimic_like_adapter --demo
          python notebooks/source/lecture1.py
          python notebooks/source/lecture2.py
          python notebooks/source/hierarchical.py
          python notebooks/source/sbi_neural.py
          python notebooks/source/project_starter.py
          python notebooks/source/open_research_challenge.py
          python notebooks/source/three_day_research.py

      - name: Run and save independent-test simulation study
        run: python -m project.research_experiments --repeats 3 --source-size 2000 --test-size 1200

      - name: Validate datasets and notebooks
        run: python tools/validate_workshop.py

      - name: Execute core notebooks
        run: |
          python tools/run_notebook.py notebooks/01_lecture1_uncertainty_foundations_instructor.ipynb
          python tools/run_notebook.py notebooks/02_lecture2_trustworthy_deployment_instructor.ipynb
          python tools/run_notebook.py notebooks/01_lecture1_uncertainty_foundations_student.ipynb
          python tools/run_notebook.py notebooks/02_lecture2_trustworthy_deployment_student.ipynb
          python tools/run_notebook.py notebooks/90_team_project_starter.ipynb
          python tools/run_notebook.py notebooks/91_open_research_challenge_starter.ipynb
          python tools/run_notebook.py notebooks/92_three_day_research_starter.ipynb

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regenerate slide figures and PowerPoint decks
        run: |
          python slides/make_figures.py
          npm install --prefix slides/src --no-save pptxgenjs
          cd slides
          node src/deck1.js
          node src/deck2.js
          node src/one_lecture.js

      - name: Validate slide geometry, notes and scientific provenance
        run: |
          python tools/check_slides.py
          python tools/audit_integrated_lecture.py
          git diff --check

      - name: Install local presentation renderer when missing
        run: |
          if ! command -v libreoffice >/dev/null 2>&1 || ! command -v pdftoppm >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libreoffice-impress poppler-utils
          fi

      - name: Render all 23 lecture pages for visual inspection
        run: python tools/render_integrated_lecture_review.py

      # Update deliverable PPTX and contact sheets on human-originated branch
      # changes. Skip bot commits to prevent generated ZIP timestamp loops.
      - name: Commit verified generated workshop materials
        if: github.event_name == 'push' && github.ref_name == 'chatgpt/mauritius-one-lecture-three-day-research-2026' && github.actor != 'github-actions[bot]'
        run: |
          git add notebooks/01_lecture1_uncertainty_foundations_student.ipynb
          git add notebooks/01_lecture1_uncertainty_foundations_instructor.ipynb
          git add notebooks/02_lecture2_trustworthy_deployment_student.ipynb
          git add notebooks/02_lecture2_trustworthy_deployment_instructor.ipynb
          git add notebooks/03_hierarchical_pymc_student.ipynb
          git add notebooks/03_hierarchical_pymc_instructor.ipynb
          git add notebooks/04_simulation_based_inference_student.ipynb
          git add notebooks/04_simulation_based_inference_instructor.ipynb
          git add notebooks/90_team_project_starter.ipynb
          git add notebooks/91_open_research_challenge_starter.ipynb
          git add notebooks/92_three_day_research_starter.ipynb
          git add project/open_data project/results project/mimic_like_demo docs/qa
          git add slides/figures slides/lecture1_honest_probabilities.pptx slides/lecture2_deciding_under_uncertainty.pptx slides/lecture_when_can_we_trust_clinical_ai.pptx
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Regenerate and verify workshop decks, notebooks and project data'
            # Other repository updates may have landed during this long build.
            # Rebase generated-only changes rather than rejecting a clean build.
            TARGET=chatgpt/mauritius-one-lecture-three-day-research-2026
            for attempt in 1 2 3; do
              git fetch origin "$TARGET"
              git rebase "origin/$TARGET"
              if git push origin HEAD:"$TARGET"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Could not push generated artifacts after three fast-forward attempts."
                exit 1
              fi
              sleep 2
            done
          fi
